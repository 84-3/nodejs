<!doctype html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#08090d">
    <meta name="description" content="Page not found">
    <script>
        (function () {
            try {
                var saved = localStorage.getItem("sfxdarei-theme");
                document.documentElement.setAttribute("data-theme", saved === "light" ? "light" : "dark");
            } catch (e) { /* keep the dark default */ }
        })();
    </script>
    <title>404 · SFXDarei Manager</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/error.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <main class="error-page" id="main">
        <section class="error-card glass">
            <span class="error-mark" aria-hidden="true">404</span>
            <h1>Page not found</h1>
            <p>The page you were looking for doesn’t exist or has moved.</p>
            <div class="error-actions">
                <a href="/" class="btn btn-primary">Go to dashboard</a>
                <button class="btn btn-ghost" type="button" onclick="history.back()">Go back</button>
            </div>
        </section>

        <p class="error-foot">SFXDarei Manager</p>
    </main>

    <script src="/js/theme.js" defer></script>
</body>
</html>
