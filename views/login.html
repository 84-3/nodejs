<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#08090d">
    <!-- Apply the saved theme before first paint to avoid a flash. -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem("sfxdarei-theme");
                document.documentElement.setAttribute("data-theme", saved === "light" ? "light" : "dark");
            } catch (e) { /* keep the dark default */ }
        })();
    </script>
    <title>Sign in · SFXDarei Manager</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="auth-theme">
        <button class="icon-btn" type="button" data-theme-toggle
                aria-pressed="false" aria-label="Switch to light theme">
            <span data-theme-icon aria-hidden="true">☀</span>
        </button>
    </div>

    <main class="auth-page" id="main">
        <form class="auth-card glass" method="post" action="/login">
            <div class="auth-brand">
                <span class="auth-mark" aria-hidden="true">S</span>
                <span class="auth-brand-text">
                    <strong>SFXDarei</strong>
                    <span>Manager</span>
                </span>
            </div>

            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-sub">Sign in to manage authorized users, analytics and the live script.</p>

            <div class="auth-alert" id="auth-alert" role="alert" hidden>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="9"></circle>
                    <line x1="12" y1="8" x2="12" y2="12.5"></line>
                    <circle cx="12" cy="16" r="0.6" fill="currentColor" stroke="none"></circle>
                </svg>
                <span id="auth-alert-text"></span>
            </div>

            <div class="auth-form">
                <div class="field-group">
                    <label for="username">Username</label>
                    <input class="field" type="text" id="username" name="username"
                           autocomplete="username" required autofocus>
                </div>

                <div class="field-group">
                    <label for="password">Password</label>
                    <div class="password-wrap">
                        <input class="field" type="password" id="password" name="password"
                               autocomplete="current-password" required>
                        <button class="reveal-btn" type="button" id="togglePassword"
                                aria-label="Show password" aria-pressed="false">
                            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                                 aria-hidden="true">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <button class="btn btn-primary auth-submit" type="submit">Sign in</button>
            </div>

            <p class="auth-foot">Access is restricted to configured administrators.</p>
        </form>
    </main>

    <script src="/js/theme.js" defer></script>
    <script>
        // --- Password reveal ---------------------------------------------
        var revealBtn = document.getElementById("togglePassword");
        var passwordInput = document.getElementById("password");

        var EYE_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
        var EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';

        revealBtn.addEventListener("click", function () {
            var revealed = passwordInput.type === "password";
            passwordInput.type = revealed ? "text" : "password";
            this.innerHTML = revealed ? EYE_OFF : EYE_OPEN;
            this.setAttribute("aria-pressed", String(revealed));
            this.setAttribute("aria-label", revealed ? "Hide password" : "Show password");
        });

        // --- Explain a failed attempt instead of silently looping ---------
        var error = new URLSearchParams(location.search).get("error");
        if (error) {
            var alert = document.getElementById("auth-alert");
            var text = document.getElementById("auth-alert-text");

            text.textContent = error === "config"
                ? "Login is not configured on the server. Set DASHBOARD_USER and DASHBOARD_PASSWORD in .env, then restart."
                : "Incorrect username or password. Please try again.";

            alert.hidden = false;
            passwordInput.value = "";
            passwordInput.focus();
        }
    </script>
</body>
</html>
